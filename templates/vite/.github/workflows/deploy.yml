name: deploy
# Push to main: check and deploy in parallel (a hotfix never waits on browsers); a failed check rolls back.
# Needs secrets DEPLOY_SSH_KEY and DEPLOY_HOST_KEY, and deploy.host in wdk.config.js.
on:
  push:
    branches: [main]
jobs:
  check:
    uses: mstcgalis/web-dev-kit/.github/workflows/check.yml@v0.14.0
    secrets:
      NIX_ACCESS_TOKEN: ${{ secrets.NIX_ACCESS_TOKEN }}
  deploy:
    uses: mstcgalis/web-dev-kit/.github/workflows/deploy.yml@v0.14.0
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      NIX_ACCESS_TOKEN: ${{ secrets.NIX_ACCESS_TOKEN }}
  rollback:
    needs: [check, deploy]
    if: failure() && needs.deploy.result == 'success' && needs.check.result == 'failure'
    uses: mstcgalis/web-dev-kit/.github/workflows/deploy.yml@v0.14.0
    with:
      rollback: true
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      NIX_ACCESS_TOKEN: ${{ secrets.NIX_ACCESS_TOKEN }}
