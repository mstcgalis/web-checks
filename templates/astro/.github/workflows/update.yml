name: update
# Weekly: open a PR when the wdk has a new release. Needs NIX_ACCESS_TOKEN with Contents, Pull requests and Workflows write.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  update:
    uses: mstcgalis/web-dev-kit/.github/workflows/update.yml@278ed50b3d94f78d521216bef1c791f8872f04e8 # v0.16.0
    secrets:
      NIX_ACCESS_TOKEN: ${{ secrets.NIX_ACCESS_TOKEN }}
