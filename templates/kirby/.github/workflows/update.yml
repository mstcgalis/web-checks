name: update
# Weekly: open a PR when the wdk has a new release. Needs NIX_ACCESS_TOKEN with Contents and Pull requests write.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  update:
    uses: mstcgalis/web-dev-kit/.github/workflows/update.yml@v0.12.0
    secrets:
      NIX_ACCESS_TOKEN: ${{ secrets.NIX_ACCESS_TOKEN }}
