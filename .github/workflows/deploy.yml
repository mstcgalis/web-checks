# Reusable: a site calls this after pushing to main, with
# `uses: mstcgalis/web-dev-kit/.github/workflows/deploy.yml@vX.Y.Z`. It runs `wdk deploy`: the built
# site streams to the host's restricted deploy key (vps `site-release`), seconds, no vps CI involved.
# `rollback: true` runs `wdk deploy rollback --if-current <this sha>` (a failed check after deploy).
# Needs `deploy.host` in wdk.config.js.
name: deploy
on:
  workflow_call:
    inputs:
      rollback:
        type: boolean
        default: false
    secrets:
      # Private half of the vps site's `deployKey`.
      DEPLOY_SSH_KEY:
        required: true
      # A pinned `ssh-keyscan -t ed25519 HOST` line: no trust on first use.
      DEPLOY_HOST_KEY:
        required: true
      # Read-only GitHub token so Nix can fetch private flake inputs (the wdk, sibling repos).
      NIX_ACCESS_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      # Project code runs here, before the deploy key exists on the runner.
      - run: nix develop -c wdk deploy --build-only
        if: ${{ !inputs.rollback }}
        env:
          NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKEN != '' && format('access-tokens = github.com={0}', secrets.NIX_ACCESS_TOKEN) || '' }}
      - name: ssh key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      - run: nix develop -c wdk deploy ${{ inputs.rollback && format('rollback --if-current {0}', github.sha) || '--no-build' }}
        env:
          NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKEN != '' && format('access-tokens = github.com={0}', secrets.NIX_ACCESS_TOKEN) || '' }}
