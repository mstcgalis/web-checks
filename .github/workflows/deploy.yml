# Reusable: a site calls this after pushing to main, with
# `uses: mstcgalis/web-dev-kit/.github/workflows/deploy.yml@vX.Y.Z`. It runs `wdk deploy`: the built
# site streams to the host's restricted deploy key (vps `site-release`), seconds, no vps CI involved.
# `rollback: true` runs `wdk deploy rollback --if-current <this sha>` (a failed check after deploy).
# Needs `deploy.host` in wdk.config.js. With no DEPLOY_SSH_KEY secret it skips with a notice (a new repo
# before its vps entry: `wdk new --domain D --vps HOST` sets the key up).
name: deploy
on:
  workflow_call:
    inputs:
      rollback:
        type: boolean
        default: false
      # Deploy to this `user@host` instead of `deploy.host` (staging).
      host:
        type: string
        default: ''
      # Commit to deploy, default the triggering sha. A `workflow_run` caller passes the sha Tests ran on, so a
      # push landing in between can't ship untested code.
      ref:
        type: string
        default: ''
      # After the flip, `curl` this URL; a failure rolls back (a PHP fatal breaks every page).
      url:
        type: string
        default: ''
    secrets:
      # Private half of the vps site's `deployKey`.
      DEPLOY_SSH_KEY:
        required: false
      # A pinned `ssh-keyscan -t ed25519 HOST` line: no trust on first use.
      DEPLOY_HOST_KEY:
        required: false
      # Read-only GitHub token so Nix can fetch private flake inputs (the wdk, sibling repos).
      NIX_ACCESS_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ]; then echo keyed=true >> "$GITHUB_OUTPUT"
          else echo "::notice::no DEPLOY_SSH_KEY secret, not deployed (add the vps site entry and the key: wdk new --domain D --vps HOST)"; fi
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.keyed == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3
        if: steps.gate.outputs.keyed == 'true'
      # Project code runs here, before the deploy key exists on the runner.
      - run: nix develop -c wdk deploy --build-only
        if: ${{ steps.gate.outputs.keyed == 'true' && !inputs.rollback }}
        env:
          NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKEN != '' && format('access-tokens = github.com={0}', secrets.NIX_ACCESS_TOKEN) || '' }}
      - name: ssh key
        if: steps.gate.outputs.keyed == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      - run: nix develop -c wdk deploy ${{ inputs.rollback && format('rollback --if-current {0}', inputs.ref || github.sha) || '--no-build' }}${{ inputs.host && format(' --host {0}', inputs.host) || '' }}
        if: steps.gate.outputs.keyed == 'true'
        env:
          NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKEN != '' && format('access-tokens = github.com={0}', secrets.NIX_ACCESS_TOKEN) || '' }}
      - name: url check
        if: ${{ steps.gate.outputs.keyed == 'true' && inputs.url != '' && !inputs.rollback }}
        run: |
          curl -fsS --max-time 10 "${{ inputs.url }}" >/dev/null || {
            nix develop -c wdk deploy rollback --if-current ${{ inputs.ref || github.sha }}${{ inputs.host && format(' --host {0}', inputs.host) || '' }}
            exit 1
          }
        env:
          NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKEN != '' && format('access-tokens = github.com={0}', secrets.NIX_ACCESS_TOKEN) || '' }}
