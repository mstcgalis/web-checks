# Reusable: a project calls this with `uses: mstcgalis/web-dev-kit/.github/workflows/check.yml@vX.Y.Z`
name: check
on:
  workflow_call:
    inputs:
      submodules:
        type: boolean
        default: false
    secrets:
      # Read-only GitHub token so Nix can fetch private flake inputs (the wdk, sibling repos).
      NIX_ACCESS_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: ${{ inputs.submodules }}
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3
      # The token reaches only this step, and only when the secret is set.
      - run: nix develop -c just check
        env:
          NIX_CONFIG: ${{ secrets.NIX_ACCESS_TOKEN != '' && format('access-tokens = github.com={0}', secrets.NIX_ACCESS_TOKEN) || '' }}
